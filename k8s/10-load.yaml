apiVersion: v1
kind: Pod
metadata:
  name: bc-load
  labels:
    app: bc-load
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: bc-api:1.0
      imagePullPolicy: IfNotPresent
      env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secret
              key: API_KEY
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "1"
          memory: "256Mi"
      command: ["python", "-u", "-c"]
      args:
        - |
          import concurrent.futures
          import json
          import os
          import random
          import time
          import urllib.request

          # Des entrées différentes font travailler le modèle malgré le cache.
          deadline = time.monotonic() + 300
          headers = {"Content-Type": "application/json", "X-API-Key": os.environ["API_KEY"]}

          def send_requests(worker_id):
              succeeded = failed = 0
              while time.monotonic() < deadline:
                  payload = {"features": {"mean radius": random.uniform(10, 25)}}
                  request = urllib.request.Request(
                      "http://bc-api:8000/api/predict/classification",
                      data=json.dumps(payload).encode(), headers=headers, method="POST"
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=5) as response:
                          response.read()
                      succeeded += 1
                  except Exception as exc:
                      failed += 1
                      if failed == 1:
                          print(f"client {worker_id}: première erreur {type(exc).__name__}", flush=True)
                      time.sleep(0.1)
              return succeeded, failed

          print("Charge : 8 clients pendant 300 secondes", flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results = list(pool.map(send_requests, range(8)))
          print({"success": sum(x[0] for x in results), "errors": sum(x[1] for x in results)}, flush=True)
